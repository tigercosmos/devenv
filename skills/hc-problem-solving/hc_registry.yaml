groups:
  problem_framing:
    right_problem:
      implementation_name: right_problem
      official_name: null
      type: derived
      runtime_role: check
      competency: thinking_critically
      aliases:
      - gap_analysis
      derived_from:
      - dlo_framing
      - dlo_goals
      purpose: Align the stated task with the outcome that matters.
      use_when:
      - diagnostic
      - decision
      - design
      - optimization
      - strategy
      triggers:
      - The prompt prescribes a solution before defining success.
      avoid_when:
      - A clear, simple request already specifies the desired result.
      questions:
      - Would solving the stated question achieve the desired outcome?
      operation:
      - Distinguish the stated problem, underlying problem, desired outcome, and decision criterion.
      - Compare the current and desired states; identify the binding gap.
      expected_output:
      - A corrected problem statement and measurable success criterion.
      anti_patterns:
      - Replacing the user's goal with an invented objective.
      related_hcs:
      - goals
      - decomposition
      example_refs:
      - software_parallel
      - hub_fidelity
      - feature_decision
    decomposition:
      implementation_name: decomposition
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_decomposition
      purpose: Separate tractable work while preserving dependencies.
      use_when:
      - diagnostic
      - design
      - research
      - strategy
      triggers:
      - The problem contains coupled responsibilities or unknowns.
      avoid_when:
      - A split adds bookkeeping without changing the answer.
      questions:
      - Which parts can be solved independently, and which share an interface?
      operation:
      - Partition by responsibility, evidence need, or timescale.
      - Record dependencies, shared state, and integration obligations.
      expected_output:
      - Subproblems with owners or interfaces and a dependency map.
      anti_patterns:
      - Splitting until the interactions disappear.
      related_hcs:
      - system_boundaries
      - constraints
      example_refs:
      - software_parallel
    variables:
      implementation_name: variables
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_variables
      - dlo_controls
      purpose: Define the quantities a claim or model depends on.
      use_when:
      - causal
      - prediction
      - quantitative
      - research
      - optimization
      - complex_system
      - diagnostic
      triggers:
      - A metric, causal effect, or controllable input needs a precise meaning.
      avoid_when:
      - No variable distinction would change the analysis.
      questions:
      - What is measured, manipulated, held constant, or omitted?
      operation:
      - Define outputs, inputs, controls, possible confounders, and latent factors.
      - Specify units, timing, measurement method, and which inputs are actually controllable.
      expected_output:
      - A variable table with roles and measurement definitions.
      anti_patterns:
      - Treating every input as a manipulable cause.
      related_hcs:
      - correlation_causation
      - optimization
      example_refs:
      - hub_fidelity
      - revenue_cause
      - productivity_study
      - queue_optimization
  evidence:
    evidence_vs_inference:
      implementation_name: evidence_vs_inference
      official_name: null
      type: derived
      runtime_role: check
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_interpretation
      - dlo_justifications
      purpose: Keep observation and interpretation distinguishable.
      use_when:
      - explanatory
      - diagnostic
      - causal
      - research
      - decision
      triggers:
      - A conclusion is stronger than the supplied evidence.
      avoid_when:
      - An ordinary supported fact needs no evidence ledger.
      questions:
      - Which claims are observations, assumptions, or interpretations?
      operation:
      - Label consequential facts with their evidence; separate assumptions and inferences.
      - Qualify unsupported conclusions and identify the missing evidence.
      expected_output:
      - A compact evidence ledger with confidence limits.
      anti_patterns:
      - Calling an inferred explanation a measured fact.
      related_hcs:
      - source_quality
      - assumption_check
      example_refs:
      - revenue_cause
    assumption_check:
      implementation_name: assumption_check
      official_name: null
      type: derived
      runtime_role: check
      competency: thinking_critically
      aliases:
      - assumptions
      derived_from:
      - dlo_premises
      - dlo_risk
      purpose: Find the assumption whose failure changes the answer.
      use_when:
      - diagnostic
      - prediction
      - decision
      - design
      - strategy
      triggers:
      - A recommendation depends on missing or disputed premises.
      avoid_when:
      - No material premise is uncertain.
      questions:
      - Which assumption has both high uncertainty and high decision impact?
      operation:
      - List only assumptions that could reverse the conclusion.
      - Rank by uncertainty and consequence; propose a discriminating check.
      expected_output:
      - A critical assumption and the highest-value check.
      anti_patterns:
      - An exhaustive inventory of trivial assumptions.
      related_hcs:
      - sensitivity_analysis
      - testability
      example_refs: []
    plausibility:
      implementation_name: plausibility
      official_name: null
      type: derived
      runtime_role: check
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_premises
      purpose: Check whether a hypothesis has defensible premises.
      use_when:
      - explanatory
      - diagnostic
      - causal
      - research
      triggers:
      - An explanation conflicts with established mechanisms or boundary conditions.
      avoid_when:
      - Plausibility is being used instead of testing an unfamiliar but possible claim.
      questions:
      - What mechanism makes this possible under these conditions?
      operation:
      - Identify the proposed mechanism and its necessary premises.
      - Compare with established constraints; retain plausible competing hypotheses.
      expected_output:
      - A mechanism with premises that need verification.
      anti_patterns:
      - Rejecting a claim merely because it is unfamiliar.
      related_hcs:
      - estimation
      - testability
      example_refs:
      - cache_mechanism
    source_quality:
      implementation_name: source_quality
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_sources
      purpose: Weight evidence by its fitness for this claim.
      use_when:
      - factual
      - explanatory
      - research
      - decision
      triggers:
      - Sources disagree, or credibility and scope affect the answer.
      avoid_when:
      - The answer is already established by adequate direct evidence.
      questions:
      - Can this source observe or establish the claim in this context?
      operation:
      - Check provenance, method, date, incentives, and applicability.
      - Distinguish independent corroboration from repeated reporting.
      expected_output:
      - Evidence ranked by reliability and relevance.
      anti_patterns:
      - Treating prestige or citation count as proof.
      related_hcs:
      - evidence_vs_inference
      - research_design
      example_refs: []
    testability:
      implementation_name: testability
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_testability
      - dlo_discovery
      purpose: Turn a claim into a prediction that could fail.
      use_when:
      - research
      - causal
      - diagnostic
      - prediction
      triggers:
      - A claim cannot yet be distinguished from alternatives.
      avoid_when:
      - The task is a normative value choice rather than an empirical claim.
      questions:
      - What observable result would count against this claim?
      operation:
      - State a measurable prediction with population, conditions, and time horizon.
      - Define the contrary result and a feasible comparison.
      expected_output:
      - A falsifiable prediction and disconfirming observation.
      anti_patterns:
      - Changing the claim after each contrary result.
      related_hcs:
      - research_design
      - variables
      example_refs:
      - productivity_study
  logic:
    deduction:
      implementation_name: deduction
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases:
      - fallacies
      derived_from:
      - dlo_deduction
      - dlo_fallacies
      purpose: Test whether a conclusion follows from its premises.
      use_when:
      - explanatory
      - diagnostic
      - quantitative
      - ethical
      triggers:
      - An argument claims necessity or contains a logical leap.
      avoid_when:
      - An empirical generalization needs sampling evidence instead.
      questions:
      - Could all premises hold while the conclusion is false?
      operation:
      - Represent the premises and implication without rhetorical language.
      - Test a counterexample; identify fallacies and independently check premise truth.
      expected_output:
      - A valid conditional conclusion or a concrete counterexample.
      anti_patterns:
      - Confusing a valid argument with true premises.
      related_hcs:
      - induction
      - evidence_vs_inference
      example_refs: []
    induction:
      implementation_name: induction
      official_name: '#induction'
      type: concept
      runtime_role: tool
      competency: thinking_critically
      aliases: []
      source:
        document: intro2017
        location: p. 6
      purpose: Find competing generalizations supported by observations.
      use_when:
      - explanatory
      - diagnostic
      - prediction
      - research
      triggers:
      - A few examples appear to establish a general rule.
      avoid_when:
      - A deductive proof or exhaustive enumeration already settles the claim.
      questions:
      - Which other generalizations also fit these observations?
      operation:
      - Construct at least two plausible explanations of the observed pattern.
      - Deduce a differing prediction and seek a distinguishing observation.
      expected_output:
      - Tentative generalizations and a discriminating prediction.
      anti_patterns:
      - Treating repeated examples as a guarantee.
      related_hcs:
      - deduction
      - testability
      example_refs: []
  quantitative_reasoning:
    estimation:
      implementation_name: estimation
      official_name: '#estimation'
      type: habit
      runtime_role: check
      competency: thinking_critically
      aliases: []
      source:
        document: intro2017
        location: p. 5
      purpose: Check quantitative claims against approximate bounds.
      use_when:
      - quantitative
      - prediction
      - optimization
      triggers:
      - A number seems precise, large, small, or physically constrained.
      avoid_when:
      - Exact calculation is trivial and no sanity check adds value.
      questions:
      - Do the units and scale fit feasible bounds?
      operation:
      - Use round numbers, dimensions, base rates, and minimum or maximum bounds.
      - Compare the claimed value with the approximate result.
      expected_output:
      - An order of magnitude or range and a discrepancy if present.
      anti_patterns:
      - Reporting rough estimates with exact-looking precision.
      related_hcs:
      - statistics
      - probability
      example_refs:
      - quantitative_capacity
    probability:
      implementation_name: probability
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_probability
      purpose: Update uncertainty using defensible probabilistic evidence.
      use_when:
      - prediction
      - decision
      - quantitative
      - research
      triggers:
      - Base rates or conditional evidence change the conclusion.
      avoid_when:
      - Probabilities are unidentifiable and scenarios are more honest.
      questions:
      - What base rate and likelihood support this update?
      operation:
      - Define events, conditioning, and the reference population.
      - Update with defensible likelihoods; otherwise retain ranges or qualitative uncertainty.
      expected_output:
      - An interpretable probability or explicit bounds on what is unknown.
      anti_patterns:
      - Inventing numerical probabilities to fill a decision table.
      related_hcs:
      - risk_uncertainty
      - statistics
      example_refs: []
    statistics:
      implementation_name: statistics
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases:
      - distributions
      - regression
      - practical_significance
      - statistical_significance
      derived_from:
      - dlo_data
      purpose: Describe variation and distinguish detection from useful effect.
      use_when:
      - quantitative
      - research
      - prediction
      triggers:
      - A mean, trend, regression, or significance claim guides a decision.
      avoid_when:
      - No data or defensible model supports the calculation.
      questions:
      - How large is the effect relative to variation and the useful threshold?
      operation:
      - Inspect distributions, sample sizes, outliers, units, and appropriate summaries.
      - Separate effect size, interval uncertainty, statistical significance, and practical significance;
        check model assumptions.
      expected_output:
      - An effect with uncertainty and a decision-relevant threshold.
      anti_patterns:
      - Treating significance as effect size or regression as causal identification.
      related_hcs:
      - variables
      - research_design
      example_refs:
      - productivity_study
  causal_reasoning:
    correlation_causation:
      implementation_name: correlation_causation
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases:
      - confounders
      derived_from:
      - dlo_correlation
      - dlo_methods
      - dlo_variables
      purpose: Assess whether association identifies a causal effect.
      use_when:
      - causal
      - diagnostic
      - research
      triggers:
      - An outcome changed after an intervention or differs between groups.
      avoid_when:
      - The request only describes an association without a causal claim.
      questions:
      - What counterfactual comparison would isolate the intervention?
      operation:
      - Identify reverse causation, confounders, selection effects, and concurrent changes.
      - Assess randomization or explicit identification assumptions; propose a defensible comparison.
      expected_output:
      - A bounded causal claim and evidence needed to distinguish causes.
      anti_patterns:
      - Assuming temporal sequence, adjustment, or correlation proves causation.
      related_hcs:
      - variables
      - research_design
      example_refs:
      - revenue_cause
  decision_making:
    goals:
      implementation_name: goals
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_goals
      purpose: Make trade-offs depend on the actual values and outcome.
      use_when:
      - decision
      - optimization
      - strategy
      - ethical
      triggers:
      - People disagree about what success means.
      avoid_when:
      - The objective is already clear and uncontested.
      questions:
      - Whose goals determine the criterion, and which values conflict?
      operation:
      - Separate outcomes, proxy metrics, values, and guiding principles.
      - Define evaluation criteria and surface stakeholder conflicts.
      expected_output:
      - An outcome criterion with explicit value trade-offs.
      anti_patterns:
      - Silently optimizing a convenient proxy.
      related_hcs:
      - cost_benefit
      - ethical_conflicts
      example_refs:
      - queue_optimization
    cost_benefit:
      implementation_name: cost_benefit
      official_name: '#utility'
      type: habit
      runtime_role: check
      competency: thinking_critically
      aliases:
      - opportunity_cost
      - sunk_cost
      - temporal_discounting
      source:
        document: intro2017
        location: p. 7
      purpose: Compare future consequences for affected stakeholders.
      use_when:
      - decision
      - design
      - optimization
      - strategy
      - negotiation
      - ethical
      triggers:
      - Options trade resources or distribute benefits unevenly.
      avoid_when:
      - A strict constraint already determines the only feasible option.
      questions:
      - What changes for each stakeholder if this option is chosen?
      operation:
      - Compare future benefits, direct costs, externalities, and foregone opportunities by stakeholder
        and time horizon.
      - Separate recoverable switching costs from sunk costs; make time preferences and value judgments
        explicit.
      expected_output:
      - A comparable consequence table with opportunity costs and distributional effects.
      anti_patterns:
      - Counting past spending as a future benefit or summing incompatible values.
      related_hcs:
      - goals
      - risk_uncertainty
      example_refs:
      - software_parallel
      - hub_fidelity
      - feature_decision
      - supplier_agreement
      - allocation_ethics
      supporting_objectives:
      - dlo_costs
      - dlo_sunk_costs
      - dlo_time_preferences
    bias_check:
      implementation_name: bias_check
      official_name: null
      type: derived
      runtime_role: check
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_bias
      - dlo_sunk_costs
      purpose: Challenge anchoring and one-sided evidence selection.
      use_when:
      - decision
      - diagnostic
      - strategy
      - research
      triggers:
      - The prompt favors a solution or cites prior investment.
      avoid_when:
      - No plausible bias would change the evidence or decision.
      questions:
      - What would a credible critic choose or measure differently?
      operation:
      - Look for confirmation, availability, anchoring, and sunk-cost pressure.
      - Apply equal standards to the favored option and its strongest rival.
      expected_output:
      - A challenged premise or a fair comparison.
      anti_patterns:
      - Listing bias names without changing the analysis.
      related_hcs:
      - alternative_generation
      - assumption_check
      example_refs: []
    risk_uncertainty:
      implementation_name: risk_uncertainty
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_risk
      purpose: Separate estimable risks from poorly characterized outcomes.
      use_when:
      - decision
      - prediction
      - design
      - strategy
      triggers:
      - Failure consequences or weak evidence affect commitment.
      avoid_when:
      - No consequential uncertainty remains.
      questions:
      - What can be estimated, and what remains poorly characterized?
      operation:
      - Separate known hazards with supported probabilities from unknown probabilities or outcomes.
      - Compare downside, reversibility, mitigations, and assumption dependence without fabricated precision.
      expected_output:
      - A risk and uncertainty summary with a reversible next step when useful.
      anti_patterns:
      - Collapsing all uncertainty into an invented expected value.
      related_hcs:
      - sensitivity_analysis
      - decision_tree
      example_refs:
      - feature_decision
    decision_tree:
      implementation_name: decision_tree
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases: []
      derived_from:
      - dlo_trees
      purpose: Compare sequential choices and information gained before commitment.
      use_when:
      - decision
      - strategy
      - research
      triggers:
      - Later choices depend on outcomes or new evidence.
      avoid_when:
      - A single-stage comparison is sufficient.
      questions:
      - Which choice can wait until information becomes available?
      operation:
      - Represent decision nodes, outcome branches, and consequences.
      - Use supported probabilities only; compare staged options and information-gathering cost.
      expected_output:
      - A small decision tree with branch conditions.
      anti_patterns:
      - A large tree with invented probabilities.
      related_hcs:
      - alternative_generation
      - risk_uncertainty
      example_refs: []
    alternative_generation:
      implementation_name: alternative_generation
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_critically
      aliases:
      - alternatives
      derived_from:
      - dlo_choices
      - dlo_creative_heuristics
      purpose: Escape a false binary or premature commitment.
      use_when:
      - decision
      - design
      - optimization
      - strategy
      - negotiation
      triggers:
      - Only the proposed option is evaluated.
      avoid_when:
      - A hard constraint genuinely permits only one option.
      questions:
      - What credible option uses a different mechanism or commitment level?
      operation:
      - Include the status quo when feasible and at least one distinct mechanism or staged option.
      - Compare benefits, costs, constraints, risks, assumptions, and consequences; remove only defensibly
        dominated options.
      expected_output:
      - A short set of viable alternatives with decisive trade-offs.
      anti_patterns:
      - Straw-man alternatives added to justify the preferred solution.
      related_hcs:
      - cost_benefit
      - constraints
      example_refs:
      - software_parallel
      - feature_decision
  problem_solving:
    constraints:
      implementation_name: constraints
      official_name: '#constraints'
      type: concept
      runtime_role: tool
      competency: thinking_creatively
      aliases: []
      source:
        document: intro2017
        location: p. 10
      purpose: Prune infeasible solutions and identify negotiable limits.
      use_when:
      - decision
      - design
      - optimization
      - strategy
      - negotiation
      triggers:
      - Requirements or resource limits define feasibility.
      avoid_when:
      - Constraints do not distinguish plausible answers.
      questions:
      - Which limits are hard, soft, negotiable, conflicting, or derived?
      operation:
      - Classify constraints and record their evidence, owner, and conditions.
      - Propagate constraints to options; check conflicts before optimizing preferences.
      expected_output:
      - A constraint table and a feasible solution set.
      anti_patterns:
      - Treating assumptions as immutable limits.
      related_hcs:
      - right_problem
      - optimization
      example_refs:
      - software_parallel
      - hub_fidelity
      - queue_optimization
      - supplier_agreement
    model_types:
      implementation_name: model_types
      official_name: '#modeltypes'
      type: concept
      runtime_role: tool
      competency: thinking_creatively
      aliases: []
      source:
        document: intro2017
        location: p. 9
      purpose: Choose a representation that supports the intended inference.
      use_when:
      - explanatory
      - prediction
      - design
      - complex_system
      - research
      triggers:
      - The proposed representation may omit decisive behavior.
      avoid_when:
      - A direct observation answers the question without a model.
      questions:
      - What decision or prediction must this model support?
      operation:
      - Compare conceptual, mathematical, physical, and simulation representations against
        the required outputs.
      - State assumptions, resolution, data requirements, and a validation target.
      expected_output:
      - A model choice with scope and testable predictions.
      anti_patterns:
      - Equating detail with validity.
      related_hcs:
      - simulation
      - variables
      example_refs: []
    analogy:
      implementation_name: analogy
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_creatively
      aliases: []
      derived_from:
      - dlo_analogy
      purpose: Transfer a useful relationship without importing irrelevant details.
      use_when:
      - design
      - diagnostic
      - strategy
      triggers:
      - A known solution may fit a new domain.
      avoid_when:
      - The proposed similarity is only superficial.
      questions:
      - Which relationship transfers, and where does it break?
      operation:
      - Map relevant relationships between the source and target cases.
      - Identify differences and test the transferred hypothesis.
      expected_output:
      - A candidate solution with transfer limits.
      anti_patterns:
      - Using resemblance as proof.
      related_hcs:
      - testability
      - decomposition
      example_refs: []
    simulation:
      implementation_name: simulation
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_creatively
      aliases: []
      derived_from:
      - dlo_simulation
      - dlo_models
      purpose: Explore dynamics when direct analysis is insufficient.
      use_when:
      - prediction
      - design
      - optimization
      - complex_system
      triggers:
      - Interactions, stochasticity, or timing affect the decision.
      avoid_when:
      - A simple calculation or observation answers the decision.
      questions:
      - What minimum fidelity preserves the decision-relevant interactions?
      operation:
      - Define question, inputs, outputs, resolution, and validation evidence before choosing a simulator.
      - Compare model predictions against observations or simpler models; report sensitivity and limits.
      expected_output:
      - A minimum useful simulation and validation plan.
      anti_patterns:
      - Treating a simulation output as evidence about reality without validation.
      related_hcs:
      - model_types
      - variables
      - sensitivity_analysis
      example_refs:
      - hub_fidelity
    optimization:
      implementation_name: optimization
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_creatively
      aliases: []
      derived_from:
      - dlo_optimization
      - dlo_goals
      purpose: Improve a real objective within a feasible decision space.
      use_when:
      - optimization
      - design
      - quantitative
      triggers:
      - Controllable choices trade a measurable outcome against constraints.
      avoid_when:
      - The true objective or feasible choices cannot yet be specified.
      questions:
      - What is the objective, and how could its proxy be gamed?
      operation:
      - Define objective, decision variables, constraints, and proxy failure modes.
      - Compare feasible candidates and test robustness or multiple objectives before recommending a method.
      expected_output:
      - An optimization formulation and a justified candidate.
      anti_patterns:
      - Optimizing a proxy while degrading the actual outcome.
      related_hcs:
      - goals
      - variables
      - constraints
      example_refs:
      - queue_optimization
    algorithms:
      implementation_name: algorithms
      official_name: null
      type: derived
      runtime_role: tool
      competency: thinking_creatively
      aliases:
      - heuristics
      derived_from:
      - dlo_creative_heuristics
      - dlo_efficient_heuristics
      - dlo_algorithms
      purpose: Choose a repeatable procedure with an appropriate cost and guarantee.
      use_when:
      - design
      - optimization
      - quantitative
      triggers:
      - Repeated search or computation needs a tractable procedure.
      avoid_when:
      - A one-off judgment has no stable procedure to implement.
      questions:
      - Does this task require a guarantee, or is a bounded heuristic sufficient?
      operation:
      - Define inputs, outputs, correctness conditions, and resource limits.
      - Compare exact algorithms and heuristics; state failure conditions and check results.
      expected_output:
      - A procedure with cost, guarantees, and validation criteria.
      anti_patterns:
      - Claiming a heuristic guarantees the optimum.
      related_hcs:
      - optimization
      - constraints
      example_refs: []
    iterative_design:
      implementation_name: iterative_design
      official_name: '#designthinking'
      type: habit
      runtime_role: check
      competency: thinking_creatively
      aliases: []
      source:
        document: intro2017
        location: p. 11
      purpose: Refine an uncertain solution through bounded feedback.
      use_when:
      - design
      - strategy
      - communication
      triggers:
      - User needs or interactions require prototype evidence.
      avoid_when:
      - A known specification already has a direct verified implementation.
      questions:
      - What small prototype tests the most consequential design uncertainty?
      operation:
      - Build a minimal prototype against a success criterion.
      - Gather relevant feedback, revise the affected design, and stop when the criterion
        is met.
      expected_output:
      - A bounded prototype and revision plan.
      anti_patterns:
      - Iterating endlessly without a stopping criterion.
      related_hcs:
      - testability
      - audience_design
      example_refs: []
  research_methods:
    research_design:
      implementation_name: research_design
