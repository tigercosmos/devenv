  ethics:
    ethical_framing:
      implementation_name: ethical_framing
      official_name: '#ethicalframing'
      type: concept
      runtime_role: tool
      competency: interacting_effectively
      aliases: []
      source:
        document: intro2017
        location: p. 17
      purpose: Recognize ethical conflict and frame affected interests.
      use_when:
      - ethical
      - decision
      - strategy
      triggers:
      - An action distributes harm, opportunity, rights, or duties.
      avoid_when:
      - No material ethical conflict exists in the narrow task.
      questions:
      - Which ethical principles are in tension, and who bears the consequences?
      operation:
      - Identify affected parties, rights, duties, harms, and fairness concerns.
      - Compare ethical frames before assessing which action is justified.
      expected_output:
      - An explicit ethical problem with alternative frames.
      anti_patterns:
      - Treating aggregate benefit as sufficient ethical justification.
      related_hcs:
      - ethical_conflicts
      - cost_benefit
