      type: derived
      runtime_role: tool
      competency: thinking_creatively
      aliases:
      - sampling
      - controls
      - observational_vs_experimental_design
      derived_from:
      - dlo_methods
      - dlo_discovery
      - dlo_significance
      purpose: Choose evidence collection that can answer the question.
      use_when:
      - research
      - causal
      - diagnostic
      triggers:
      - New evidence is needed to distinguish claims.
      avoid_when:
      - Adequate existing evidence already answers the question.
      questions:
      - Which method identifies the effect or experience of interest?
      operation:
      - Compare experiments, observations, surveys, interviews, and cases against the estimand or question.
      - Specify sampling, controls, measurement, selection limits, replication, and a useful effect threshold.
      expected_output:
      - A study design with comparison, target population, and validity limits.
      anti_patterns:
      - Assuming a survey measures causal impact or a convenience sample generalizes.
      related_hcs:
      - testability
      - variables
      - statistics
      example_refs:
      - productivity_study
      - revenue_cause
  complex_systems:
    system_boundaries:
      implementation_name: system_boundaries
      official_name: null
      type: derived
      runtime_role: tool
      competency: interacting_effectively
      aliases:
      - system_decomposition
      derived_from:
      - dlo_systems
      purpose: Identify what is inside the model and what crosses its boundary.
      use_when:
      - complex_system
      - design
      - strategy
      - diagnostic
      triggers:
      - Local changes move costs, queues, incentives, or failures elsewhere.
      avoid_when:
      - A self-contained component has no material external interaction.
      questions:
      - Which external interactions could reverse the local conclusion?
      operation:
      - Specify boundary, components, external inputs, outputs, interfaces, and feedback.
      - Track displaced effects and justify excluded processes or scales.
      expected_output:
      - A boundary and interaction map with exclusions.
      anti_patterns:
      - Optimizing one component while exporting harm outside the boundary.
      related_hcs:
      - levels_of_analysis
      - decomposition
      example_refs:
      - software_parallel
      - queue_optimization
      derivation_note: Boundary, interface, and feedback artifacts are AI extensions of the decomposition
        and interaction objectives; no official system-boundaries HC is asserted.
    levels_of_analysis:
      implementation_name: levels_of_analysis
      official_name: null
      type: derived
      runtime_role: tool
      competency: interacting_effectively
      aliases: []
      derived_from:
      - dlo_levels
      purpose: Explain links across individual, organizational, and system scales.
      use_when:
      - complex_system
      - explanatory
      - diagnostic
      - strategy
      triggers:
      - A conclusion at one scale is applied to another.
      avoid_when:
      - Only one level matters to the stated inference.
      questions:
      - How does a mechanism at one level produce the outcome at another?
      operation:
      - Identify the levels needed for the question and their measurements.
      - Trace cross-level mechanisms and check aggregation errors.
      expected_output:
      - An explanation linking relevant levels.
      anti_patterns:
      - Inferring individual behavior directly from aggregate averages.
      related_hcs:
      - emergence
      - system_boundaries
      example_refs: []
    emergence:
      implementation_name: emergence
      official_name: null
      type: derived
      runtime_role: tool
      competency: interacting_effectively
      aliases: []
      derived_from:
      - dlo_emergence
      purpose: Explain collective behavior through interactions.
      use_when:
      - complex_system
      - explanatory
      - prediction
      triggers:
      - Aggregate behavior cannot be predicted from isolated component properties.
      avoid_when:
      - The outcome is an additive total without meaningful interaction.
      questions:
      - Which interaction produces the collective pattern?
      operation:
      - Identify an aggregate pattern and candidate interaction mechanism.
      - Compare the interacting system with an interaction-free counterfactual or model.
      expected_output:
      - An interaction-based explanation with a discriminating test.
      anti_patterns:
      - Calling every surprising outcome emergent.
      related_hcs:
      - network
      - multiple_causes
      example_refs:
      - queue_optimization
    multiple_causes:
      implementation_name: multiple_causes
      official_name: null
      type: derived
      runtime_role: tool
      competency: interacting_effectively
      aliases: []
      derived_from:
      - dlo_multiple_causes
      purpose: Assess interacting contributors instead of one universal cause.
      use_when:
      - causal
      - diagnostic
      - complex_system
      triggers:
      - Several conditions jointly affect an outcome.
      avoid_when:
      - A single verified mechanism fully answers the narrow question.
      questions:
      - Which causes contribute, and which combinations are necessary or sufficient?
      operation:
      - Separate necessary, sufficient, and contributing conditions where evidence permits.
      - Map interactions and seek observations that distinguish causal combinations.
      expected_output:
      - A qualified map of interacting causes.
      anti_patterns:
      - Declaring every plausible factor causal.
      related_hcs:
      - correlation_causation
      - variables
      example_refs: []
    network:
      implementation_name: network
      official_name: null
      type: derived
      runtime_role: tool
      competency: interacting_effectively
      aliases: []
      derived_from:
      - dlo_network
      purpose: Explain how relationships alter propagation or access.
      use_when:
      - complex_system
      - strategy
      - diagnostic
      triggers:
      - Connectivity affects bottlenecks, diffusion, influence, or resilience.
      avoid_when:
      - A node and edge model would obscure the mechanism.
      questions:
      - Which relationship and direction determine the outcome?
      operation:
      - Define nodes, edge meanings, directions, weights, and missing links.
      - Analyze bottlenecks, hubs, alternate paths, and propagation against the question.
      expected_output:
      - A network mechanism and a relevant intervention.
      anti_patterns:
      - Drawing a network without using its structure.
      related_hcs:
      - emergence
      - system_boundaries
      example_refs: []
    sensitivity_analysis:
      implementation_name: sensitivity_analysis
      official_name: null
      type: derived
      runtime_role: tool
      competency: interacting_effectively
      aliases: []
      derived_from:
      - dlo_system_sensitivity
      - dlo_risk
      - dlo_simulation
      - dlo_optimization
      purpose: Find the conditions under which the conclusion changes.
      use_when:
      - prediction
      - decision
      - quantitative
      - optimization
      - complex_system
      triggers:
      - A result depends on uncertain parameters or boundary choices.
      avoid_when:
      - The conclusion is robust and sensitivity adds no decision value.
      questions:
      - Which plausible parameter change reverses the recommendation?
      operation:
      - Vary the most consequential uncertain assumptions across supported ranges or scenarios.
      - Report thresholds, interactions, and the next measurement that reduces decision uncertainty.
      expected_output:
      - A reversal threshold or a qualitative robustness statement.
      anti_patterns:
      - Using arbitrary ranges to manufacture confidence.
      related_hcs:
      - assumption_check
      - risk_uncertainty
      example_refs:
      - hub_fidelity
      derivation_note: A decision sensitivity sweep is an AI synthesis of risk, simulation, and optimization
        objectives. Dynamical sensitivity in the systems objective is related, not an equivalent official
        definition.
  communication:
    composition:
      implementation_name: composition
      official_name: '#composition'
      type: habit
      runtime_role: check
      competency: communicating_effectively
      aliases: []
      source:
        document: intro2017
        location: p. 13
      purpose: Express the answer clearly with only necessary detail.
      use_when:
      - communication
      triggers:
      - Ambiguous language prevents the audience from acting.
      avoid_when:
      - Routine answer wording needs no separate operator selection.
      questions:
      - What must the reader understand or do next?
      operation:
      - State the main result early using precise, audience-appropriate language.
      - Remove redundant explanation and clarify terms that affect interpretation.
      expected_output:
      - A concise, actionable explanation.
      anti_patterns:
      - Making framework visibility a reason for verbosity.
      related_hcs:
      - audience_design
      example_refs:
      - public_explanation
    multimodal_design:
      implementation_name: multimodal_design
      official_name: '#multimodaldesign'
      type: habit
      runtime_role: check
      competency: communicating_effectively
      aliases: []
      source:
        document: intro2017
        location: p. 14
      purpose: Make visual or multimedia structure support comprehension.
      use_when:
      - communication
      - design
      triggers:
      - Perception or visual organization changes user understanding.
      - Physical controls or product cues invite an incorrect action.
      avoid_when:
      - Plain prose conveys the result more effectively.
      questions:
      - Which perceptual cue helps the audience interpret the information correctly?
      operation:
      - Match physical cues, controls, or visual hierarchy to the required action and intended users.
      - Check perception, accessibility, misleading scales or cues, and compatibility between modalities;
        test actual user behavior.
      expected_output:
      - A product or communication design with clear action cues and an observable usability check.
      anti_patterns:
      - Adding decoration that obscures the decision.
      related_hcs:
      - audience_design
      - statistics
      example_refs:
      - public_explanation
      supporting_objectives:
      - dlo_visualization
    audience_design:
      implementation_name: audience_design
      official_name: null
      type: derived
      runtime_role: tool
      competency: communicating_effectively
      aliases:
      - argument_structure
      - thesis
      - organization
      - professionalism
      derived_from:
      - dlo_language
      - dlo_audience
      - dlo_nonverbal
      purpose: Match the argument and medium to the receiver's decision.
      use_when:
      - communication
      - strategy
      - negotiation
      triggers:
      - Different audiences need different evidence or framing.
      avoid_when:
      - The audience and presentation are already adequate.
      questions:
      - What does this audience know, value, and need to decide?
      operation:
      - Define audience, thesis, evidence structure, medium, and professional conventions.
      - Check organization, connotation, tone, and supported interpretation; avoid inventing nonverbal
        cues in text-only settings.
      expected_output:
      - An audience-specific argument and presentation plan.
      anti_patterns:
      - Tailoring language by suppressing contrary evidence.
      related_hcs:
      - composition
      - multimodal_design
      example_refs:
      - public_explanation
