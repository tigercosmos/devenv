      - allocation_ethics
    ethical_conflicts:
      implementation_name: ethical_conflicts
      official_name: null
      type: derived
      runtime_role: tool
      competency: interacting_effectively
      aliases: []
      derived_from:
      - dlo_ethics
      purpose: Resolve competing principles with explicit contextual reasons.
      use_when:
      - ethical
      - decision
      triggers:
      - Valid ethical principles support conflicting actions.
      avoid_when:
      - There is no conflict between the relevant principles.
      questions:
      - What contextual reason justifies prioritizing one principle here?
      operation:
      - Compare feasible actions under the competing principles and affected stakeholders.
      - State priority, justification, mitigation, and conditions that would change it.
      expected_output:
      - A justified choice with remaining ethical costs.
      anti_patterns:
      - Using a numerical score to hide a value judgment.
      related_hcs:
      - ethical_framing
      - goals
      example_refs:
      - allocation_ethics
